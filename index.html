<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Anuario Hogwarts 2025–2026</title>


<style>

/* =========================================================
   COLORES
========================================================= */

:root{

  --paper:#f1e8da;
  --paper-light:#faf6ee;
  --paper-2:#f8f2e9;

  --ink:#211d19;
  --muted:#6b645c;

  --line:#bcae9d;

  --red:#8f2b26;
  --red-dark:#6f201d;

  --green:#355d46;

  --yellow:#c89a31;
  --yellow-dark:#9d741f;

  --blue:#2d4d70;

  --silver:#b6bac1;

  --memorial:#758190;
  --memorial-dark:#4b5868;
  --memorial-light:#d7dbe0;

  --white:#fbf8f2;

  --shadow:
    0 14px 34px rgba(0,0,0,.08);

}


/* =========================================================
   GENERAL
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:var(--ink);

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(0,0,0,.025) 1px,
      transparent 1px
    ),
    radial-gradient(
      circle at 80% 40%,
      rgba(0,0,0,.02) 1px,
      transparent 1px
    ),
    var(--paper);

  background-size:
    22px 22px,
    31px 31px;

}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

img{
  display:block;
  width:100%;
}

.page{

  width:min(1220px,96%);
  margin:20px auto;

  position:relative;
  overflow:hidden;

  background:var(--paper-2);

  border:1px solid #ad9f8d;

  box-shadow:
    0 24px 60px rgba(0,0,0,.12);

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

.nav{

  position:sticky;
  top:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

  padding:17px 30px;

  background:rgba(248,242,233,.96);

  border-bottom:1px solid var(--line);

  backdrop-filter:blur(10px);

}

.brand{

  display:flex;
  align-items:center;

  gap:12px;

  min-width:max-content;

}

.brand-mark{

  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border:1px solid #867a6a;
  border-radius:50%;

  font-size:18px;
  font-weight:bold;

}

.brand-text{

  font-size:12px;

  letter-spacing:2px;

  text-transform:uppercase;

}

.nav-links{

  display:flex;
  align-items:center;

  gap:12px;

  font-size:8px;

  text-transform:uppercase;

  letter-spacing:.9px;

}

.nav-links a{

  position:relative;

  padding:7px 0;

}

.nav-links a::after{

  content:"";

  position:absolute;

  left:0;
  bottom:1px;

  width:0;
  height:1px;

  background:var(--ink);

  transition:.25s ease;

}

.nav-links a:hover::after{
  width:100%;
}

.menu-button{

  display:none;

  padding:9px 12px;

  border:1px solid var(--line);

  background:transparent;

  cursor:pointer;

  text-transform:uppercase;

  font-size:9px;

  letter-spacing:1px;

}

.mobile-menu{

  display:none;

  padding:12px 18px 18px;

  border-bottom:1px solid var(--line);

  background:var(--paper-2);

}

.mobile-menu.open{
  display:block;
}

.mobile-menu a{

  display:block;

  padding:11px 0;

  border-bottom:1px solid #dfd6ca;

  font-size:10px;

  letter-spacing:1px;

  text-transform:uppercase;

}


/* =========================================================
   PORTADA
========================================================= */

.hero{

  min-height:650px;

  display:grid;

  grid-template-columns:
    .9fr 1.35fr;

  align-items:center;

  gap:34px;

  padding:58px 58px 50px;

  border-bottom:1px solid var(--line);

}

.hero-copy{

  position:relative;

  z-index:2;

}

.eyebrow{

  margin-bottom:8px;

  font-size:18px;

  letter-spacing:2.5px;

  text-transform:uppercase;

}

.hero h1{

  margin:0;

  font-size:76px;

  line-height:.93;

  font-weight:400;

  letter-spacing:-2px;

}

.year{

  margin:20px 0 18px;

  color:var(--red);

  font-size:34px;

  letter-spacing:2px;

}

.flourish{

  margin:19px 0;

  color:#665b4d;

  font-size:27px;

  letter-spacing:9px;

}

.hero-quote{

  max-width:410px;

  font-size:15px;

  line-height:1.75;

  letter-spacing:1px;

  text-transform:uppercase;

}


/* =========================================================
   HOMENAJE PORTADA
========================================================= */

.memorial-dedication{

  max-width:470px;

  margin-top:30px;

  padding:20px 22px;

  position:relative;

  color:var(--memorial-dark);

  border-top:1px solid var(--memorial-light);

  border-bottom:1px solid var(--memorial-light);

}

.memorial-dedication::before{

  content:"✦";

  position:absolute;

  top:-9px;
  left:50%;

  transform:translateX(-50%);

  padding:0 10px;

  background:var(--paper-2);

  color:var(--memorial);

}

.memorial-label{

  display:block;

  margin-bottom:8px;

  color:var(--memorial);

  font-size:9px;

  letter-spacing:3px;

  text-transform:uppercase;

}

.memorial-name{

  display:block;

  margin-bottom:9px;

  color:var(--memorial-dark);

  font-size:21px;

  letter-spacing:1px;

}

.memorial-info{

  display:block;

  font-size:10px;

  line-height:1.8;

  letter-spacing:1px;

  text-transform:uppercase;

}

.memorial-founders{

  display:block;

  margin-top:11px;

  color:#6f747b;

  font-size:9px;

  line-height:1.7;

  letter-spacing:1.2px;

  text-transform:uppercase;

}

.castle{

  width:100%;

  min-height:620px;

  display:flex;

  align-items:stretch;
  justify-content:center;

  overflow:hidden;

  background:var(--paper);

}

.castle-image{

  width:100%;
  height:100%;

  min-height:620px;

  object-fit:cover;

  object-position:center;

}


/* =========================================================
   SECCIONES
========================================================= */

section{

  padding:54px 48px;

}

.section-title{

  display:flex;

  align-items:center;
  justify-content:center;

  gap:16px;

  margin-bottom:35px;

  text-align:center;

}

.section-title::before,
.section-title::after{

  content:"";

  width:170px;
  height:1px;

  background:var(--line);

}

.section-title h2{

  margin:0;

  font-size:27px;

  font-weight:400;

  letter-spacing:1.8px;

  text-transform:uppercase;

}

.section-subtitle{

  max-width:720px;

  margin:-10px auto 34px;

  color:var(--muted);

  text-align:center;

  font-size:14px;

  line-height:1.75;

}

.btn{

  display:inline-block;

  padding:10px 20px;

  border:1px solid #9f927f;

  background:transparent;

  font-size:9px;

  letter-spacing:1.2px;

  text-transform:uppercase;

  transition:.22s ease;

  cursor:pointer;

}

.btn:hover{

  color:white;

  background:var(--ink);

}


/* =========================================================
   DIRECCIÓN
========================================================= */

.direction{

  border-bottom:1px solid var(--line);

}

.direction-grid{

  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:38px;

}

.direction-card{

  padding:12px 12px 25px;

  text-align:center;

  background:rgba(255,255,255,.19);

  border:1px solid var(--line);

  cursor:pointer;

  transition:.25s ease;

}

.direction-card:hover{

  transform:translateY(-5px);

  box-shadow:var(--shadow);

}

.direction-photo{

  width:100%;

  aspect-ratio:4/5;

  display:grid;

  place-items:center;

  overflow:hidden;

  background:#d9d1c5;

  color:#726b62;

  font-size:11px;

}

.direction-photo img{

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center top;

}

.direction-role{

  display:block;

  margin-top:16px;

  color:#8a7652;

  font-size:9px;

  letter-spacing:2px;

  text-transform:uppercase;

}

.direction-card h3{

  margin:8px 0 5px;

  font-size:18px;

  font-weight:400;

  letter-spacing:1px;

  text-transform:uppercase;

}

.direction-card p{

  margin:0;

  color:var(--muted);

  font-size:10px;

  letter-spacing:1px;

  text-transform:uppercase;

}

.click-hint{

  display:block;

  margin-top:14px;

  color:#8b7a61;

  font-size:8px;

  letter-spacing:1.4px;

  text-transform:uppercase;

}


/* =========================================================
   CASAS
========================================================= */

.houses{

  border-bottom:1px solid var(--line);

}

.houses-grid{

  max-width:900px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:28px;

}

.house-card{

  position:relative;

  padding:30px 22px 25px;

  text-align:center;

  background:rgba(255,255,255,.18);

  border:1px solid var(--line);

  transition:.28s ease;

}

.house-card:hover{

  transform:translateY(-5px);

  box-shadow:var(--shadow);

}

.house-card h3{

  margin:0;

  font-size:24px;

  font-weight:400;

}

.house-symbol{

  width:180px;
  height:210px;

  margin:20px auto;

  display:flex;

  align-items:center;
  justify-content:center;

}

.house-symbol img{

  width:100%;
  height:100%;

  object-fit:contain;

}

.house-card p{

  min-height:42px;

  margin:0 0 18px;

  font-size:11px;

  line-height:1.5;

  letter-spacing:.8px;

  text-transform:uppercase;

}

.gryffindor h3{
  color:var(--red);
}

.slytherin h3{
  color:var(--green);
}

.hufflepuff h3{
  color:var(--yellow-dark);
}

.ravenclaw h3{
  color:var(--blue);
}


/* =========================================================
   PROFESORES
========================================================= */

.professors-section{

  text-align:center;

  border-bottom:1px solid var(--line);

}


/* =========================================================
   LUCAS NOTT
========================================================= */

.lucas-section{

  position:relative;

  overflow:hidden;

  border-bottom:1px solid var(--line);

  background:
    linear-gradient(
      135deg,
      rgba(45,77,112,.07),
      rgba(255,255,255,.1)
    );

}

.lucas-section::before{

  content:"";

  position:absolute;

  left:0;
  top:0;

  width:6px;
  height:100%;

  background:var(--blue);

  opacity:.75;

}

.lucas-wrap{

  max-width:960px;

  margin:auto;

  display:grid;

  grid-template-columns:
    .78fr 1.22fr;

  align-items:center;

  gap:48px;

}

.lucas-photo-frame{

  position:relative;

  padding:10px;

  background:#f5f1e9;

  border:1px solid #aeb5be;

  box-shadow:
    0 16px 34px rgba(39,48,60,.12);

}

.lucas-photo-frame::before{

  content:"IN MEMORIAM";

  position:absolute;

  top:18px;
  left:-13px;

  z-index:2;

  padding:6px 14px;

  background:var(--blue);

  color:white;

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;

}

.lucas-photo{

  aspect-ratio:4/5;

  overflow:hidden;

  display:grid;

  place-items:center;

  background:#d7d9dc;

}

.lucas-photo img{

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center 20%;

}

.lucas-small-title{

  display:block;

  margin-bottom:10px;

  color:var(--blue);

  font-size:9px;

  letter-spacing:3px;

  text-transform:uppercase;

}

.lucas-copy h2{

  margin:0 0 10px;

  color:var(--memorial-dark);

  font-size:42px;

  font-weight:400;

}

.lucas-roles{

  margin-bottom:24px;

  color:var(--blue);

  font-size:10px;

  line-height:1.8;

  letter-spacing:1.3px;

  text-transform:uppercase;

}

.lucas-divider{

  width:70px;
  height:1px;

  margin-bottom:22px;

  background:var(--memorial);

}

.lucas-copy p{

  max-width:600px;

  margin:0 0 18px;

  color:#504d49;

  font-size:15px;

  line-height:1.9;

}

.lucas-quote{

  margin:25px 0;

  padding-left:20px;

  border-left:2px solid var(--memorial-light);

  color:#5e6670;

  font-size:16px;

  line-height:1.75;

  font-style:italic;

}

.lucas-btn{

  color:var(--blue);

  border-color:var(--blue);

}

.lucas-btn:hover{

  color:white;

  background:var(--blue);

}


/* =========================================================
   HISTORIA
========================================================= */

.history-section{

  border-bottom:1px solid var(--line);

}

.history-box{

  max-width:900px;

  margin:auto;

  padding:35px 48px;

  text-align:center;

  border:1px solid var(--line);

  background:rgba(255,255,255,.13);

}

.history-symbol{

  margin-bottom:18px;

  color:#8c795b;

  font-size:28px;

}

.history-box h3{

  margin:0 0 22px;

  font-size:31px;

  font-weight:400;

  letter-spacing:1.5px;

  text-transform:uppercase;

}

.history-box p{

  max-width:780px;

  margin:0 auto 17px;

  color:#524c45;

  font-size:15px;

  line-height:1.9;

}

.founders{

  margin-top:26px;

  color:#746b61;

  font-size:11px;

  line-height:1.8;

  letter-spacing:1.4px;

  text-transform:uppercase;

}


/* =========================================================
   MOMENTOS IMPORTANTES
========================================================= */

.moments{

  border-bottom:1px solid var(--line);

}

.moments-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

}

.moment-card{

  display:block;

  position:relative;

  padding:8px;

  color:inherit;

  background:#f9f5ee;

  border:1px solid var(--line);

  transition:.25s ease;

  cursor:pointer;

}

.moment-card:hover{

  transform:translateY(-6px);

  box-shadow:
    0 12px 28px rgba(0,0,0,.09);

}

.moment-photo{

  position:relative;

  width:100%;

  aspect-ratio:4/3;

  overflow:hidden;

  display:grid;

  place-items:center;

  background:#d9d2c7;

}

.moment-photo img{

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center;

}

.moment-overlay{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  opacity:0;

  color:white;

  background:
    rgba(25,24,22,.55);

  font-size:9px;

  letter-spacing:1.6px;

  text-transform:uppercase;

  transition:.25s ease;

}

.moment-card:hover .moment-overlay{
  opacity:1;
}

.moment-card h3{

  margin:13px 0 6px;

  text-align:center;

  font-size:14px;

  font-weight:400;

  letter-spacing:1px;

  text-transform:uppercase;

}

.moment-card p{

  margin:0 5px 9px;

  color:var(--muted);

  text-align:center;

  font-size:9px;

  line-height:1.6;

}

.moment-arrow{

  display:block;

  margin-bottom:5px;

  text-align:center;

  color:#8d7e68;

  font-size:16px;

}


/* =========================================================
   PRÓXIMAMENTE
========================================================= */

.coming-soon-card{

  position:relative;

  cursor:not-allowed;

  overflow:hidden;

}

.coming-soon-card:hover{

  transform:none;

  box-shadow:none;

}

.coming-soon-card .moment-photo img{

  filter:
    grayscale(.15)
    brightness(.72);

}

.coming-soon-card .moment-overlay{

  opacity:1;

  background:
    rgba(18,18,18,.38);

}

.coming-soon-badge{

  position:absolute;

  top:13px;
  left:13px;

  z-index:10;

  padding:8px 12px;

  color:white;

  background:
    rgba(30,27,23,.88);

  border:
    1px solid rgba(255,255,255,.38);

  font-size:8px;

  letter-spacing:1.7px;

  text-transform:uppercase;

  backdrop-filter:blur(6px);

}

.coming-soon-note{

  display:block;

  margin:
    9px 6px 10px;

  padding:
    9px 10px;

  color:#71572a;

  background:
    rgba(200,154,49,.09);

  border-top:
    1px solid rgba(157,116,31,.32);

  border-bottom:
    1px solid rgba(157,116,31,.32);

  text-align:center;

  font-size:8px;

  line-height:1.6;

  letter-spacing:.8px;

  text-transform:uppercase;

}


/* =========================================================
   GRADUACIÓN 2026
========================================================= */

.graduation-section{

  position:relative;

  border-bottom:1px solid var(--line);

  background:
    linear-gradient(
      135deg,
      rgba(200,154,49,.07),
      rgba(255,255,255,.16)
    );

}

.graduation-wrap{

  max-width:1000px;

  margin:auto;

  display:grid;

  grid-template-columns:
    1.15fr .85fr;

  align-items:center;

  gap:42px;

}

.graduation-photo{

  position:relative;

  aspect-ratio:16/10;

  overflow:hidden;

  padding:9px;

  background:white;

  border:1px solid #b5a995;

  box-shadow:
    0 15px 35px rgba(0,0,0,.10);

}

.graduation-photo img{

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center;

}

.graduation-year{

  display:block;

  margin-bottom:10px;

  color:var(--yellow-dark);

  font-size:10px;

  letter-spacing:3px;

  text-transform:uppercase;

}

.graduation-copy h2{

  margin:0 0 18px;

  font-size:43px;

  font-weight:400;

  line-height:1;

  text-transform:uppercase;

}

.graduation-copy p{

  margin:0 0 24px;

  color:#595148;

  font-size:15px;

  line-height:1.8;

}

.graduation-divider{

  width:70px;
  height:1px;

  margin:0 0 22px;

  background:var(--yellow);

}

.graduation-status{

  display:inline-block;

  margin-bottom:18px;

  padding:8px 13px;

  color:#
